name: tests

on:
  push:
  pull_request:

# A newer push to the same branch cancels an in-flight run for it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the backend Dockerfile (python:3.10-slim).
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements.txt

      - name: Install dependencies
        # backend/requirements.txt carries --extra-index-url for the CPU torch wheels, so
        # this pulls the small CPU build rather than the multi-gigabyte CUDA one.
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r tests/requirements.txt

      - name: Show environment
        run: |
          python --version
          python -c "import torch, fastapi; print('torch', torch.__version__, '| fastapi', fastapi.__version__)"

      - name: Run pytest
        # No .env and no MongoDB on the runner: Settings falls back to its defaults, and the
        # test fixtures stub out model loading and the database. The ~94 MB checkpoint is
        # gitignored and intentionally absent here.
        run: pytest -v
