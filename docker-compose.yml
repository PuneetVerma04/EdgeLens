services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: edgelens-backend:latest
    container_name: edgelens-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: ${MONGODB_URL}
      ENVIRONMENT: development
    networks:
      - edgelens-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/edgelens/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: edgelens-frontend:latest
    container_name: edgelens-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edgelens-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  edgelens-network:
    driver: bridge
