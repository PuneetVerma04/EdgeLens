<!doctype html>
<!--
  GitHub Pages landing page. Without this file, Pages has nothing to serve at the repo
  root and its Jekyll theme renders README.md instead - which is what the GitHub.com repo
  page already shows, so on the Pages site the root should go to the thing you can only
  see on Pages: the browser demo.

  README.md is untouched; GitHub.com renders it independently of Pages.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>EdgeLens</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="web-demo/">
<meta http-equiv="refresh" content="0; url=web-demo/">
<script>location.replace("web-demo/");</script>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; background: #0b0d10; color: #e6eaef;
         display: grid; place-items: center; min-height: 100vh; margin: 0; }
  a { color: #5ad2c8; }
</style>
</head>
<body>
  <p>Redirecting to the <a href="web-demo/">EdgeLens browser demo</a>…</p>
</body>
</html>
