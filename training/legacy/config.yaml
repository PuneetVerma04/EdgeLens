datasets:
  casting:
    path: "D:/Datasets/CastingProductImageDataset/casting_512x512"
    num_classes: 2
    classes: ["def_front", "ok_front"]
    input_size: 224

  pcb:
    raw_path: "D:/Datasets/DsPCBSD"
    crops_path: "D:/Datasets/DsPCBSD/crops"   # generated by scripts/prepare_pcb_crops.py
    num_classes: 9
    classes: ["SH", "SP", "SC", "OP", "MB", "HB", "CS", "CFO", "BMFO"]
    input_size: 224

training:
  batch_size: 32
  num_epochs: 30
  learning_rate: 0.001
  val_split: 0.2          # used only when dataset has no pre-split (e.g. casting)
  early_stopping_patience: 5
  min_delta: 0.001
  num_workers: 0          # set to 0 on Windows to avoid multiprocessing errors
  lr_scheduler:
    step_size: 7
    gamma: 0.1

output:
  model_dir: "outputs/models"
  plots_dir: "outputs/plots"
